<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders | Asili Coffee Nursery</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #1b1b1b;
        }

        /* ================================
           HEADER
        ================================= */

        .admin-header {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: #0B5D1E;
            color: #ffffff;
        }

        .admin-logo h1 {
            font-size: 1.5rem;
        }

        .admin-logo span {
            font-weight: normal;
            opacity: 0.85;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            border: 1px solid rgba(255, 255, 255, 0.5);

            background: transparent;
            color: #ffffff;

            padding: 9px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;

            text-decoration: none;
        }

        .header-btn:hover {
            background: #ffffff;
            color: #0B5D1E;
        }


        /* ================================
           MAIN
        ================================= */

        .orders-container {
            width: 92%;
            max-width: 1400px;

            margin: 40px auto;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #666;
        }


        /* ================================
           SUMMARY
        ================================= */

        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .summary-card {
            background: #ffffff;

            padding: 22px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .summary-card h3 {
            color: #666;

            font-size: 0.9rem;

            margin-bottom: 10px;
        }

        .summary-card strong {
            color: #0B5D1E;

            font-size: 1.8rem;
        }


        /* ================================
           TABLE
        ================================= */

        .orders-table-container {
            background: #ffffff;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }

        th,
        td {
            padding: 15px;

            text-align: left;

            border-bottom: 1px solid #eeeeee;
        }

        th {
            background: #f8faf8;

            color: #444;

            font-size: 0.85rem;

            text-transform: uppercase;

            letter-spacing: 0.03em;
        }

        td {
            font-size: 0.9rem;
        }

        .status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 0.75rem;

            font-weight: 700;

            text-transform: capitalize;

            background: #fff3cd;

            color: #856404;
        }

        .empty-message {
            text-align: center;

            padding: 40px;

            color: #777;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 700px) {

            .admin-header {
                padding: 0 4%;
            }

            .admin-logo h1 {
                font-size: 1.15rem;
            }

            .header-actions {
                gap: 5px;
            }

            .header-btn {
                padding: 8px 10px;

                font-size: 0.8rem;
            }

            .orders-container {
                width: 94%;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

        }

        /* ================================
   ORDER DETAILS MODAL
================================ */

.order-details-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background: rgba(0, 0, 0, 0.55);
}

.order-details-modal[hidden] {
    display: none;
}

.order-details-card {
    width: min(700px, 100%);
    max-height: 90vh;

    overflow-y: auto;

    background: #ffffff;

    border-radius: 16px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25);
}

.order-details-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 24px 28px;

    border-bottom: 1px solid #e5e7eb;
}

.order-details-label {
    margin: 0 0 4px;

    font-size: 0.75rem;
    font-weight: 700;

    letter-spacing: 0.12em;

    color: #4CAF50;
}

.order-details-header h2 {
    margin: 0;

    color: #0B5D1E;

    font-size: 1.5rem;
}

.close-order-details {
    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: #f3f4f6;
    color: #333;

    font-size: 1.6rem;
    line-height: 1;

    cursor: pointer;

    transition: 0.2s ease;
}

.close-order-details:hover {
    background: #e5e7eb;
}

.order-details-content {
    padding: 28px;
}

.order-detail-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 18px;
}

.order-detail-grid > div {
    padding: 18px;

    background: #f8faf8;

    border: 1px solid #e5e7eb;

    border-radius: 10px;
}

.order-detail-grid span {
    display: block;

    margin-bottom: 6px;

    font-size: 0.78rem;
    font-weight: 600;

    color: #6b7280;

    text-transform: uppercase;

    letter-spacing: 0.04em;
}

.order-detail-grid strong {
    display: block;

    color: #1f2937;

    font-size: 1rem;
}


/* ================================
   ORDER VIEW BUTTON
================================ */

.view-order-button {
    padding: 7px 14px;

    border: none;
    border-radius: 7px;

    background: #0B5D1E;
    color: #ffffff;

    font-size: 0.8rem;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;
}

.view-order-button:hover {
    background: #4CAF50;
}


/* ================================
   STATUS SELECT
================================ */

.status-select {
    padding: 7px 10px;

    border: 1px solid #d1d5db;
    border-radius: 7px;

    background: #ffffff;
    color: #333;

    font-size: 0.8rem;

    cursor: pointer;
}

.status-select:focus,
.view-order-button:focus,
.close-order-details:focus {
    outline: 2px solid #4CAF50;
    outline-offset: 2px;
}


/* ================================
   MODAL MOBILE
================================ */

@media (max-width: 600px) {

    .order-details-modal {
        padding: 14px;
    }

    .order-details-header {
        padding: 20px;
    }

    .order-details-content {
        padding: 20px;
    }

    .order-detail-grid {
        grid-template-columns: 1fr;
    }

}

.order-detail-message {
    grid-column: 1 / -1;
}

.order-detail-message strong {
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}

.order-detail-actions {
    grid-column: 1 / -1;

    display: flex;
    gap: 12px;

    margin-top: 6px;
}

.call-order-button {
    padding: 10px 16px;

    border: 1px solid #0B5D1E;
    border-radius: 7px;

    background: #ffffff;
    color: #0B5D1E;

    font-size: 0.85rem;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;
}

.call-order-button:hover {
    background: #0B5D1E;
    color: #ffffff;
}

.whatsapp-order-button {
    padding: 10px 16px;

    border: none;
    border-radius: 7px;

    background: #4CAF50;
    color: #ffffff;

    font-size: 0.85rem;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;
}

.whatsapp-order-button:hover {
    background: #0B5D1E;
}

@media (max-width: 600px) {

    .order-detail-actions {
        flex-direction: column;
    }

    .whatsapp-order-button,
    .call-order-button {
        width: 100%;
    }

}

    </style>

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="admin-header">

        <div class="admin-logo">

            <h1>
                ASILI
                <span>Coffee Nursery</span>
            </h1>

        </div>


        <div class="header-actions">

            <a
                href="dashboard.html"
                class="header-btn"
            >
                Dashboard
            </a>

            <button
                id="logoutButton"
                class="header-btn"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- ================================
         ORDERS
    ================================= -->

    <main class="orders-container">


        <section class="page-heading">

            <h2>
                Orders
            </h2>

            <p>
                View and manage customer seedling orders.
            </p>

        </section>



        <!-- ================================
             SUMMARY
        ================================= -->

        <section class="summary-grid">


            <div class="summary-card">

                <h3>
                    Total Orders
                </h3>

                <strong id="totalOrders">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <h3>
                    Pending Orders
                </h3>

                <strong id="pendingOrders">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <h3>
                    Order Value
                </h3>

                <strong id="orderValue">
                    KSh 0
                </strong>

            </div>


        </section>



        <!-- ================================
             ORDERS TABLE
        ================================= -->

        <section class="orders-table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Customer
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Variety
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Method
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTableBody">

                    <tr>

                        <td
                            colspan="10"
                            class="empty-message"
                        >
                            Loading orders...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>


    </main>



    <!-- ================================
         FIREBASE
    ================================= -->

    <script
        type="module"
        src="../firebase-config.js"
    ></script>

    <script
        type="module"
        src="orders.js"
    ></script>

<!-- ================================
     ORDER DETAILS MODAL
================================ -->

<div
    id="orderDetailsModal"
    class="order-details-modal"
    hidden
>

    <div class="order-details-card">

        <div class="order-details-header">

            <div>
                <p class="order-details-label">
                    ORDER DETAILS
                </p>

                <h2>Customer Order</h2>
            </div>

            <button
                id="closeOrderDetails"
                class="close-order-details"
                type="button"
            >
                ×
            </button>

        </div>

        <div
            id="orderDetailsContent"
            class="order-details-content"
        >
        </div>

    </div>

</div>

</body>

</html>
