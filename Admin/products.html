<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Asili Coffee Nursery</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #1b1b1b;
        }


        /* ================================
           HEADER
        ================================ */

        .admin-header {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: #0B5D1E;
            color: #ffffff;
        }

        .admin-logo h1 {
            font-size: 1.5rem;
        }

        .admin-logo span {
            font-weight: normal;
            opacity: 0.85;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn,
        .logout-btn {
            padding: 9px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;

            text-decoration: none;
        }

        .back-btn {
            background: #ffffff;
            color: #0B5D1E;

            border: 1px solid #ffffff;
        }

        .logout-btn {
            background: transparent;
            color: #ffffff;

            border: 1px solid rgba(255, 255, 255, 0.5);
        }


        /* ================================
           MAIN
        ================================ */

        .products-page {
            width: 90%;
            max-width: 1200px;

            margin: 40px auto;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #666;
        }


        /* ================================
           TABLE
        ================================ */

        .table-container {
            background: #ffffff;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);

            overflow-x: auto;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th,
        .products-table td {
            padding: 16px 18px;

            text-align: left;

            border-bottom:
                1px solid #eeeeee;
        }

        .products-table th {
            background: #f0f5f1;

            color: #0B5D1E;

            font-size: 0.9rem;
        }

        .products-table td {
            font-size: 0.95rem;
        }

        .products-table tbody tr:hover {
            background: #fafcfa;
        }


        /* ================================
           BUTTONS
        ================================ */

        .edit-button {
            border: none;

            background: #0B5D1E;
            color: #ffffff;

            padding: 8px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }

        .edit-button:hover {
            opacity: 0.9;
        }


        /* ================================
           STATUS
        ================================ */

        .status-active {
            color: #0B5D1E;
            font-weight: 700;
        }

        .status-inactive {
            color: #a33;
            font-weight: 700;
        }

        /* ================================
   PRODUCT MODAL
================================ */

.modal {
    position: fixed;
    inset: 0;

    background:
        rgba(0, 0, 0, 0.45);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 1000;
}

.modal[hidden] {
    display: none;
}

.modal-content {
    width: 100%;
    max-width: 500px;

    background: #ffffff;

    border-radius: 12px;

    padding: 25px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.18);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.modal-header h2 {
    color: #0B5D1E;
}

.modal-close {
    border: none;
    background: transparent;

    font-size: 1.8rem;

    cursor: pointer;

    color: #555;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-weight: 600;
}

.form-group input,
.form-group select {
    width: 100%;

    padding: 11px 12px;

    border: 1px solid #cccccc;

    border-radius: 7px;

    font-size: 1rem;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #0B5D1E;
}

.form-group input:disabled {
    background: #eeeeee;
    color: #555;
}

.save-button {
    width: 100%;

    border: none;

    background: #0B5D1E;
    color: #ffffff;

    padding: 12px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 1rem;
    font-weight: 700;
}

.save-button:hover {
    opacity: 0.9;
}


        /* ================================
           RESPONSIVE
        ================================ */

        @media (max-width: 600px) {

            .admin-header {
                padding: 15px 5%;

                align-items: flex-start;

                gap: 15px;
            }

            .admin-logo h1 {
                font-size: 1.2rem;
            }

            .header-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .products-page {
                width: 94%;
            }

            .page-heading h2 {
                font-size: 1.6rem;
            }

        }

    </style>

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="admin-header">

        <div class="admin-logo">

            <h1>
                ASILI
                <span>Coffee Nursery</span>
            </h1>

        </div>


        <div class="header-actions">

            <a
                href="dashboard.html"
                class="back-btn"
            >
                Dashboard
            </a>

            <button
                id="logoutButton"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- ================================
         PRODUCTS
    ================================= -->

    <main class="products-page">


        <section class="page-heading">

            <h2>
                Products
            </h2>

            <p>
                Manage coffee seedling varieties,
                prices and product availability.
            </p>

        </section>



        <div class="table-container">

            <table class="products-table">

                <thead>

                    <tr>
                        <th>Variety</th>
                        <th>Price / Seedling</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>


                <tbody id="productsTableBody">

                    <tr>

                        <td colspan="4">
                            Loading products...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </main>

    <!-- ================================
     EDIT PRODUCT MODAL
================================= -->

<div
    id="productModal"
    class="modal"
    hidden
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>Edit Product</h2>

            <button
                type="button"
                id="closeProductModal"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >


            <div class="form-group">

                <label for="productVariety">
                    Variety
                </label>

                <input
                    type="text"
                    id="productVariety"
                    disabled
                >

            </div>


            <div class="form-group">

                <label for="productPrice">
                    Price per Seedling (KSh)
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="1"
                    step="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="productStatus">
                    Product Status
                </label>

                <select
                    id="productStatus"
                    required
                >

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="save-button"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>



    <!-- ================================
         FIREBASE
    ================================= -->

    <script
        type="module"
        src="../firebase-config.js"
    ></script>

    <script
        type="module"
        src="products.js"
    ></script>


</body>

</html>
